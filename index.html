<!doctype html>
<html lang="fr">
<head>

<meta property="og:type" content="website">
<meta property="og:title" content="Code du Travail & Convention minière — Guinée">
<meta property="og:description" content="Le Code du travail guinéen et la Convention collective des mines et carrières : recherche par article ou mot-clé, texte officiel, explication claire, conseil RH et lexique.">
<meta property="og:locale" content="fr_FR">
<meta name="twitter:card" content="summary">
<title>Code du Travail Guinée</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Code Travail GN">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --paper:#f6f4ee; --surface:#fffdf8; --surface-2:#f0ede4; --ink:#22271f; --ink-soft:#54594c;
  --line:#dfdacb; --line-strong:#cdc7b4;
  --accent:#1f5d43; --accent-soft:#2c7a58; --accent-tint:#e6efe8; --accent-ink:#134030;
  --conv:#4a4a9e; --conv-soft:#5f5fbf; --conv-tint:#ebebf7; --conv-ink:#33327a;
  --exp-bg:#eef2f4; --exp-line:#c6d5dc; --exp-ink:#1c4451; --exp-accent:#1f6a80;
  --rh-bg:#f7efdd; --rh-line:#e4cf9f; --rh-ink:#6a4c15; --rh-accent:#a9741a;
  --mark:#ffe39c; --mark-ink:#4a3a06;
  --shadow:0 1px 2px rgba(30,25,10,.05),0 6px 22px rgba(30,25,10,.06);
  --shadow-sm:0 1px 2px rgba(30,25,10,.06);
  --radius:14px; --radius-sm:9px;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141612; --surface:#1c1f19; --surface-2:#23271f; --ink:#eae7dc; --ink-soft:#a6a595;
    --line:#33372c; --line-strong:#454a3a;
    --accent:#5cae86; --accent-soft:#6dbf96; --accent-tint:#1e3329; --accent-ink:#9fdcbd;
    --conv:#9a93e6; --conv-soft:#8a82df; --conv-tint:#26234a; --conv-ink:#c5bff0;
    --exp-bg:#182a30; --exp-line:#2c4650; --exp-ink:#a8d4e0; --exp-accent:#79bccf;
    --rh-bg:#2a2413; --rh-line:#4d4225; --rh-ink:#e2c887; --rh-accent:#d1a24e;
    --mark:#5a4a12; --mark-ink:#ffe8a8;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --paper:#141612; --surface:#1c1f19; --surface-2:#23271f; --ink:#eae7dc; --ink-soft:#a6a595;
  --line:#33372c; --line-strong:#454a3a;
  --accent:#5cae86; --accent-soft:#6dbf96; --accent-tint:#1e3329; --accent-ink:#9fdcbd;
  --conv:#9a93e6; --conv-soft:#8a82df; --conv-tint:#26234a; --conv-ink:#c5bff0;
  --exp-bg:#182a30; --exp-line:#2c4650; --exp-ink:#a8d4e0; --exp-accent:#79bccf;
  --rh-bg:#2a2413; --rh-line:#4d4225; --rh-ink:#e2c887; --rh-accent:#d1a24e;
  --mark:#5a4a12; --mark-ink:#ffe8a8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.35);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}

/* ---- Shell ---- */
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
.sidebar{border-right:1px solid var(--line);background:var(--surface);position:sticky;top:0;height:100vh;overflow-y:auto;padding:0}
.brand{padding:20px 20px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.brand .flag{display:flex;gap:4px;margin-bottom:12px}
.brand .flag i{width:16px;height:11px;border-radius:2px;display:block}
.brand .flag i:nth-child(1){background:#ce1126}.brand .flag i:nth-child(2){background:#fcd116}.brand .flag i:nth-child(3){background:#009460}
.brand h1{font-family:var(--serif);font-size:20px;font-weight:600;margin:0;line-height:1.2;letter-spacing:-.01em}
.brand .sub{font-size:11.5px;color:var(--ink-soft);margin-top:4px;text-transform:uppercase;letter-spacing:.08em;font-weight:500}
.nav{padding:10px 12px 40px}
.nav .navtitle{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft);font-weight:600;padding:14px 8px 6px}
.nav .navtitle.conv{color:var(--conv-ink)}
.nav-btn{width:100%;text-align:left;border:0;background:none;color:var(--ink);font-family:var(--sans);font-size:13.5px;font-weight:600;padding:9px 10px;border-radius:8px;cursor:pointer;display:flex;gap:9px;align-items:center;line-height:1.3;margin-bottom:2px}
.nav-btn:hover{background:var(--surface-2)}
.nav-btn.active{background:var(--accent-tint);color:var(--accent-ink)}
.nav-btn.active .ln{color:var(--accent-ink)}
.nav-btn svg{width:16px;height:16px;flex:none;stroke-width:2}
.nav-home{margin-bottom:2px}
.livre-btn .ln{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:600;flex:none;width:20px;text-align:center}
.conv-btn .ln{font-family:var(--mono);font-size:10.5px;color:var(--conv);font-weight:600;flex:none;width:24px;text-align:center}
.conv-btn.active{background:var(--conv-tint);color:var(--conv-ink)}
.conv-btn.active .ln{color:var(--conv-ink)}
.nav-lex svg{color:var(--exp-accent)}
.nav-btn.active.nav-lex svg{color:var(--accent-ink)}
.viewhead{margin:0 0 16px}
.backbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);font-family:var(--sans);font-size:13px;font-weight:600;padding:7px 14px 7px 10px;border-radius:9px;cursor:pointer;transition:all .13s}
.backbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-tint)}
.backbtn svg{width:16px;height:16px}
.titre-chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}
.tchip{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:500;cursor:pointer;transition:all .13s}
.tchip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-tint)}
.tsec-h{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--ink);margin:30px 0 14px;padding-bottom:9px;border-bottom:2px solid var(--line);scroll-margin-top:160px}
.tsec:first-of-type .tsec-h{margin-top:6px}

/* ---- Main ---- */
.backdrop{display:none}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:16px 28px}
.searchrow{display:flex;gap:12px;align-items:center;max-width:900px;margin:0 auto}
.searchbox{flex:1;position:relative;display:flex;align-items:center}
.searchbox svg{position:absolute;left:14px;width:18px;height:18px;color:var(--ink-soft);pointer-events:none}
#q{width:100%;font-family:var(--sans);font-size:16px;padding:13px 14px 13px 42px;border:1.5px solid var(--line-strong);border-radius:12px;background:var(--surface);color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-tint)}
#q::placeholder{color:var(--ink-soft)}
.clearbtn{position:absolute;right:10px;border:0;background:var(--surface-2);color:var(--ink-soft);width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:15px;line-height:1;display:none}
.clearbtn:hover{color:var(--ink)}
.themebtn{flex:none;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);width:44px;height:44px;border-radius:12px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.themebtn:hover{color:var(--accent);border-color:var(--accent)}
.filterrow{max-width:900px;margin:11px auto 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.srcfilter{display:inline-flex;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:10px;padding:3px;gap:2px}
.srcfilter button{border:0;background:none;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink-soft);padding:6px 13px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px}
.srcfilter button .dot{width:8px;height:8px;border-radius:50%;flex:none}
.srcfilter button[data-src="code"] .dot{background:var(--accent)}
.srcfilter button[data-src="ccmc"] .dot{background:var(--conv)}
.srcfilter button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.filterlabel{font-size:11.5px;color:var(--ink-soft);font-weight:500}
.hint{max-width:900px;margin:10px auto 0;font-size:12px;color:var(--ink-soft);display:flex;gap:16px;flex-wrap:wrap}
.hint b{color:var(--ink);font-weight:600}
.hint code{font-family:var(--mono);background:var(--surface-2);padding:1px 6px;border-radius:5px;font-size:11.5px;color:var(--accent-ink)}

.content{flex:1;padding:28px 28px 80px}
.inner{max-width:860px;margin:0 auto}

/* ---- Results meta ---- */
.resmeta{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:2px 0 18px;flex-wrap:wrap}
.resmeta h2{font-family:var(--serif);font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em}
.resmeta .count{font-size:13px;color:var(--ink-soft);font-family:var(--mono)}

/* ---- Source block header (search, two sources) ---- */
.srcblock-h{display:flex;align-items:center;gap:10px;font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#fff;padding:10px 16px;border-radius:10px;margin:30px 0 16px;scroll-margin-top:150px}
.srcblock-h:first-child{margin-top:4px}
.srcblock-h.code{background:var(--accent)}
.srcblock-h.conv{background:var(--conv)}
.srcblock-h svg{width:16px;height:16px;flex:none}
.srcblock-h .c{margin-left:auto;font-family:var(--mono);font-weight:600;letter-spacing:0;text-transform:none;opacity:.9}

/* ---- Theme summary banner ---- */
.summary{background:linear-gradient(180deg,var(--accent-tint),var(--surface));border:1px solid var(--accent-soft);border-radius:var(--radius);padding:22px 24px;margin-bottom:26px;box-shadow:var(--shadow-sm)}
.summary .cap{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:10px}
.summary .cap svg{width:15px;height:15px}
.summary h3{font-family:var(--serif);font-size:21px;margin:0 0 10px;font-weight:600}
.summary p{margin:0 0 10px;font-size:14.5px;line-height:1.62;color:var(--ink)}
.summary p:last-child{margin-bottom:0}
.summary .refs{margin-top:14px;padding-top:14px;border-top:1px solid var(--accent-soft);font-size:12.5px;color:var(--ink-soft)}
.summary .refs a{font-family:var(--mono);color:var(--accent-ink);text-decoration:none;font-weight:600;font-size:12px;background:var(--surface);border:1px solid var(--accent-soft);padding:2px 8px;border-radius:6px;margin:0 5px 5px 0;display:inline-block}
.summary .refs a:hover{background:var(--accent);color:#fff}

/* ---- Lexicon banner (search) ---- */
.lexbanner{background:var(--exp-bg);border:1px solid var(--exp-line);border-left:3px solid var(--exp-accent);border-radius:var(--radius-sm);padding:15px 18px;margin-bottom:22px}
.lexbanner .cap{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--exp-accent);margin-bottom:7px}
.lexbanner .cap svg{width:14px;height:14px}
.lexbanner .lt{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink);margin-bottom:4px}
.lexbanner .ld{font-size:13.5px;line-height:1.55;color:var(--exp-ink);margin:0}
.lexbanner .pl{margin-top:9px;background:none;border:0;padding:0;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--exp-accent);cursor:pointer}
.lexbanner .pl:hover{text-decoration:underline}

/* ---- Article card ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow-sm);scroll-margin-top:150px}
.card.ccmc{border-left:3px solid var(--conv)}
.card:target{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.card.ccmc:target{border-color:var(--conv);box-shadow:0 0 0 3px var(--conv-tint)}
.card .head{display:flex;align-items:flex-start;gap:14px;margin-bottom:6px}
.badge{font-family:var(--mono);font-size:13px;font-weight:600;color:#fff;background:var(--accent);padding:5px 11px;border-radius:8px;white-space:nowrap;flex:none;line-height:1.3}
.badge.conv{background:var(--conv)}
.crumb{font-size:11.5px;color:var(--ink-soft);line-height:1.5;padding-top:2px}
.crumb b{color:var(--ink-soft);font-weight:600}
.crumb .sep{opacity:.5;margin:0 5px}
.srcpill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:2px 8px;border-radius:999px;margin-right:8px;vertical-align:middle}
.srcpill.code{background:var(--accent-tint);color:var(--accent-ink)}
.srcpill.conv{background:var(--conv-tint);color:var(--conv-ink)}
.arttitle{font-family:var(--serif);font-size:17px;font-weight:600;margin:12px 0 0;color:var(--ink);line-height:1.35}
.artbody{font-family:var(--serif);font-size:16.5px;line-height:1.68;color:var(--ink);margin-top:10px}
.artbody p{margin:0 0 12px}
.artbody p:last-child{margin-bottom:0}

.panels{margin-top:18px;display:flex;flex-direction:column;gap:12px}
.panel{border-radius:var(--radius-sm);padding:15px 17px;border:1px solid}
.panel .lab{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin-bottom:8px}
.panel .lab svg{width:14px;height:14px}
.panel p{margin:0;font-size:14px;line-height:1.6}
.panel.exp{background:var(--exp-bg);border-color:var(--exp-line)}
.panel.exp .lab{color:var(--exp-accent)}.panel.exp p{color:var(--exp-ink)}
.panel.rh{background:var(--rh-bg);border-color:var(--rh-line)}
.panel.rh .lab{color:var(--rh-accent)}.panel.rh p{color:var(--rh-ink)}
.panel.pending{background:var(--surface-2);border-color:var(--line);border-style:dashed}
.panel.pending p{color:var(--ink-soft);font-style:italic;font-size:13px}

mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 2px;font-weight:600}

/* ---- Share button + menu + toast ---- */
.sharebtn{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .13s}
.sharebtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-tint)}
.sharebtn svg{width:16px;height:16px}
#sharemenu{position:absolute;z-index:60;min-width:210px;background:var(--surface);border:1px solid var(--line-strong);border-radius:11px;box-shadow:var(--shadow);padding:6px;display:none}
#sharemenu button{width:100%;text-align:left;border:0;background:none;color:var(--ink);font-family:var(--sans);font-size:13.5px;font-weight:500;padding:9px 11px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:10px}
#sharemenu button:hover{background:var(--surface-2)}
#sharemenu button svg{width:16px;height:16px;flex:none;color:var(--ink-soft)}
#sharemenu .wa svg{color:#25d366}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--accent);color:#fff;font-family:var(--sans);font-size:13.5px;font-weight:600;padding:11px 20px;border-radius:999px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---- Favorites / actions / Mes articles ---- */
.cardactions{margin-left:auto;display:flex;gap:7px;flex:none}
.badgebtn{border:0;cursor:pointer}
.badgebtn:hover{filter:brightness(1.1)}
.favbtn{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .13s}
.favbtn:hover{border-color:#d9a400;color:#d9a400}
.favbtn svg{width:16px;height:16px}
.favbtn.on{border-color:#e6b800;color:#c98a00;background:#fdf4dd}
.favbtn.on svg{fill:#edb400}
.nav-mine svg{color:#c98a00}
.nav-btn.active.nav-mine svg{color:var(--accent-ink)}
.minetabs{display:flex;gap:8px;margin:0 0 22px;border-bottom:1px solid var(--line)}
.minetabs button{border:0;background:none;font-family:var(--sans);font-size:14px;font-weight:600;color:var(--ink-soft);padding:10px 2px;margin-right:18px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.minetabs button.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
.minesec{margin-bottom:26px}
.minesec h4{font-family:var(--sans);font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft);font-weight:600;margin:0 0 12px}
.clearhist{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);font-family:var(--sans);font-size:13px;font-weight:600;padding:8px 14px;border-radius:9px;cursor:pointer;margin-top:4px}
.clearhist:hover{border-color:#c0392b;color:#c0392b}
.ctxlink{border:0;background:none;color:var(--accent);font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;padding:0}
.ctxlink:hover{text-decoration:underline}

/* ---- Lexicon terms in text + popover ---- */
.term{border-bottom:1.5px dotted var(--exp-accent);cursor:help}
.term:hover{background:var(--exp-bg)}
#lexpop{position:absolute;z-index:60;max-width:330px;background:var(--surface);border:1px solid var(--exp-line);border-left:3px solid var(--exp-accent);border-radius:10px;box-shadow:var(--shadow);padding:14px 16px;font-family:var(--sans);display:none}
#lexpop .pt{font-family:var(--serif);font-weight:600;font-size:15px;color:var(--ink);margin-bottom:5px;padding-right:18px}
#lexpop .pd{font-size:13px;line-height:1.55;color:var(--ink-soft)}
#lexpop .pl{margin-top:10px;font-size:12px;font-weight:600;color:var(--exp-accent);cursor:pointer;background:none;border:0;padding:0;font-family:var(--sans)}
#lexpop .pl:hover{text-decoration:underline}
#lexpop .px{position:absolute;top:7px;right:10px;border:0;background:none;color:var(--ink-soft);cursor:pointer;font-size:16px;line-height:1}

/* ---- Lexicon view ---- */
.lexintro{font-family:var(--serif);font-size:16px;line-height:1.6;color:var(--ink-soft);max-width:660px;margin:2px 0 18px}
.lexsearch{position:relative;max-width:460px;margin:0 0 14px}
.lexsearch input{width:100%;font-family:var(--sans);font-size:15px;padding:11px 14px 11px 40px;border:1.5px solid var(--line-strong);border-radius:11px;background:var(--surface);color:var(--ink);outline:none}
.lexsearch input:focus{border-color:var(--exp-accent);box-shadow:0 0 0 4px var(--exp-bg)}
.lexsearch svg{position:absolute;left:13px;top:12px;width:17px;height:17px;color:var(--ink-soft)}
.lexalpha{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 18px}
.lexalpha button{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);min-width:30px;height:30px;padding:0 6px;border-radius:7px;font-family:var(--mono);font-size:12px;font-weight:600;cursor:pointer}
.lexalpha button:hover{border-color:var(--exp-accent);color:var(--exp-accent)}
.lexletter{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--exp-accent);margin:22px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--line);scroll-margin-top:150px}
.lexcard{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--exp-accent);border-radius:var(--radius-sm);padding:16px 18px;margin-bottom:12px;scroll-margin-top:150px}
.lexcard:target{box-shadow:0 0 0 3px var(--exp-bg)}
.lexcard .lt{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink);margin-bottom:6px}
.lexcard .ld{font-size:14px;line-height:1.6;color:var(--ink);margin:0}
.lexcard .lr{margin-top:11px;font-size:12px;color:var(--ink-soft)}
.lexcard .lr a{font-family:var(--mono);text-decoration:none;font-weight:600;font-size:11.5px;padding:2px 8px;border-radius:6px;margin:0 5px 5px 0;display:inline-block;border:1px solid;cursor:pointer}
.lexcard .lr a.code{color:var(--accent-ink);background:var(--accent-tint);border-color:var(--accent-soft)}
.lexcard .lr a.ccmc{color:var(--conv-ink);background:var(--conv-tint);border-color:var(--conv-soft)}
.lexnone{color:var(--ink-soft);font-size:14px;padding:20px 0}

.empty{text-align:center;padding:70px 20px;color:var(--ink-soft)}
.empty svg{width:46px;height:46px;opacity:.5;margin-bottom:14px}
.empty h3{font-family:var(--serif);color:var(--ink);font-size:20px;margin:0 0 6px;font-weight:600}
.empty p{margin:0;font-size:14px}

/* ---- Home / welcome ---- */
.welcome{padding:6px 0 0}
.welcome .lead{font-family:var(--serif);font-size:18px;line-height:1.6;color:var(--ink);max-width:660px;margin:0 0 20px}
.scopebox{display:flex;flex-direction:column;gap:10px;max-width:660px;margin:0 0 28px}
.scoperow{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 16px}
.scoperow .tag{font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:3px 9px;border-radius:999px;flex:none;margin-top:1px}
.scoperow.code .tag{background:var(--accent-tint);color:var(--accent-ink)}
.scoperow.conv .tag{background:var(--conv-tint);color:var(--conv-ink)}
.scoperow .txt{font-size:13.5px;color:var(--ink);line-height:1.5}
.scoperow .txt b{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:34px}
.chip{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 15px;font-size:13px;font-weight:500;cursor:pointer;transition:all .13s}
.chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-tint)}
.chip.lex{border-style:dashed;border-color:var(--exp-line);color:var(--exp-accent)}
.chip.lex:hover{background:var(--exp-bg);border-color:var(--exp-accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px;margin-bottom:36px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px 18px}
.stat .n{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--accent);line-height:1}
.stat.conv .n{color:var(--conv)}
.stat.lex .n{color:var(--exp-accent)}
.stat .l{font-size:12px;color:var(--ink-soft);margin-top:6px}
.welcome h4{font-family:var(--sans);font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft);font-weight:600;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.welcome h4 .dot{width:9px;height:9px;border-radius:50%}
.welcome h4 .dot.code{background:var(--accent)}
.welcome h4 .dot.conv{background:var(--conv)}
.booklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:30px}
.bookcard{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);padding:16px 18px;cursor:pointer;transition:all .13s}
.bookcard:hover{border-color:var(--accent);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.bookcard.conv:hover{border-color:var(--conv)}
.bookcard .bn{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.bookcard.conv .bn{color:var(--conv)}
.bookcard .bt{font-family:var(--serif);font-size:16px;font-weight:600;margin:6px 0 4px;color:var(--ink)}
.bookcard .bc{font-size:12px;color:var(--ink-soft)}

.disclaimer{max-width:860px;margin:40px auto 0;padding:16px 18px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2);font-size:12px;color:var(--ink-soft);line-height:1.55}
.disclaimer b{color:var(--ink)}

.mobtoggle{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;z-index:30;width:284px;transform:translateX(-100%);transition:transform .22s;box-shadow:var(--shadow)}
  .sidebar.show{transform:translateX(0)}
  .mobtoggle{display:flex;align-items:center;justify-content:center;flex:none;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer}
  .backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}
  .backdrop.show{display:block}
  .content{padding:20px 16px 60px}
  .topbar{padding:12px 16px}
  .card{padding:18px 16px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="flag"><i></i><i></i><i></i></div>
      <h1>Code du Travail</h1>
      <div class="sub">Guinée · + Convention minière</div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <div class="main">
    <div class="topbar">
      <div class="searchrow">
        <button class="mobtoggle" id="mobtoggle" aria-label="Menu">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="searchbox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
          <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Rechercher un article (ex. 172.6) ou un mot-clé (ex. licenciement)…">
          <button class="clearbtn" id="clear" aria-label="Effacer">✕</button>
        </div>
        <button class="themebtn" id="themebtn" aria-label="Thème">◐</button>
      </div>
      <div class="filterrow">
        <span class="filterlabel">Source&nbsp;:</span>
        <div class="srcfilter" id="srcfilter">
          <button data-src="all" class="active">Tout</button>
          <button data-src="code"><span class="dot"></span>Code du travail</button>
          <button data-src="ccmc"><span class="dot"></span>Convention minière</button>
        </div>
      </div>
      <div class="hint">
        <span><b>Par article&nbsp;:</b> tapez <code>172.6</code> (Code) ou <code>66</code> (Convention)</span>
        <span><b>Par mot-clé&nbsp;:</b> <code>licenciement</code>, <code>prime</code>, <code>retraite</code>…</span>
      </div>
    </div>
    <div class="content"><div class="inner" id="results"></div></div>
  </div>
</div>
<div id="lexpop"></div>
<div id="sharemenu"></div>
<div id="toast"></div>

<script>
let CODE=[], CONV=[], THEMES=[], A=[], CONV_TITRES=[];
let GLOSS=[], GMAP={}, GRE=null, UIDS=new Set();
let SRC='all';

/* ---- Local storage: favorites + history ---- */
function lsGet(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
let FAV=lsGet('ctg-fav',[]), HIST=lsGet('ctg-hist',[]), QHIST=lsGet('ctg-q',[]);
if(!Array.isArray(FAV))FAV=[]; if(!Array.isArray(HIST))HIST=[]; if(!Array.isArray(QHIST))QHIST=[];
function isFav(uid){ return FAV.indexOf(uid)>=0; }
function toggleFav(uid){ const i=FAV.indexOf(uid); if(i>=0)FAV.splice(i,1); else FAV.unshift(uid); lsSet('ctg-fav',FAV); return i<0; }
function logArt(uid){ HIST=HIST.filter(x=>x!==uid); HIST.unshift(uid); if(HIST.length>40)HIST=HIST.slice(0,40); lsSet('ctg-hist',HIST); }
function logQ(q){ q=(q||'').trim(); if(!q)return; QHIST=QHIST.filter(x=>x.toLowerCase()!==q.toLowerCase()); QHIST.unshift(q); if(QHIST.length>15)QHIST=QHIST.slice(0,15); lsSet('ctg-q',QHIST); }
function artByUid(uid){ const i=(uid||'').indexOf(':'); if(i<0)return null; const s=uid.slice(0,i), id=uid.slice(i+1); return (s==='ccmc'?CONV:CODE).find(x=>x.id===id); }

const LIVRES = [
 {ln:0, name:"Titre préliminaire", desc:"Dispositions générales, principes fondamentaux"},
 {ln:1, name:"Livre 1 — Emploi", desc:"Recrutement, contrats, suspension, cessation"},
 {ln:2, name:"Livre 2 — Conditions de travail", desc:"Discipline, durée, congés, santé, salaire"},
 {ln:3, name:"Livre 3 — Partenaires sociaux", desc:"Organisations patronales et syndicales"},
 {ln:4, name:"Livre 4 — Conventions & conflits collectifs", desc:"Conventions collectives, grève, conciliation"},
 {ln:5, name:"Livre 5 — Administration & juridiction", desc:"Inspection, tribunaux du travail, sanctions"},
];

const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function cssid(id){return (id||'').replace(/[^a-z0-9.]/gi,'-');}
function elId(a){return 'art-'+a.src+'-'+cssid(a.id);}
function isSpecial(a){return a.id==='terminologie'||a.id==='preambule';}
function apos(s){return (s||'').replace(/[’ʼ]/g,"'");}

/* ---------- Convention titre helpers ---------- */
function convShort(t){
  if(/PRÉLIMINAIRES/i.test(t)) return {rom:'—', label:'Préliminaires'};
  const m=t.match(/^TITRE\s+([IVXLC]+|PREMIER)/i);
  let rom=m?m[1].toUpperCase():'';
  if(rom==='PREMIER') rom='I';
  let label=t.replace(/^TITRE\s+[^:]*:\s*/i,'').trim();
  label=label.charAt(0)+label.slice(1).toLowerCase();
  return {rom, label};
}
function cleanConvChap(t){ return (t||'').replace(/^CHAPITRE\s+[IVXLC0-9]*\s*[:\-–]?\s*/i,'').trim(); }
function buildConvTitres(){
  CONV_TITRES=[]; const idx={};
  CONV.forEach(a=>{ const k=a.livre||''; if(!(k in idx)){idx[k]=CONV_TITRES.length; CONV_TITRES.push({key:k, items:[]});} CONV_TITRES[idx[k]].items.push(a); });
}

/* ---------- Glossary build ---------- */
function reEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function buildGloss(){
  GMAP={}; const surfaces=[];
  GLOSS.forEach(g=>{
    (g.m||[g.t]).forEach(sf=>{
      const key=apos(sf).toLowerCase();
      if(!GMAP[key]) GMAP[key]=g.id;
      surfaces.push(sf);
    });
  });
  surfaces.sort((a,b)=>b.length-a.length);
  const alt=surfaces.map(s=>reEsc(apos(s)).replace(/'/g,"['\\u2019\\u02bc]")).join('|');
  try{ GRE=new RegExp("(^|[^0-9A-Za-zÀ-ÿ])("+alt+")(?![0-9A-Za-zÀ-ÿ])","gi"); }catch(e){ GRE=null; }
}
function glossById(id){ return GLOSS.find(g=>g.id===id); }

function linkTermsText(txt, seen){
  if(!GRE) return txt;
  GRE.lastIndex=0;
  return txt.replace(GRE,(m,pre,word)=>{
    const id=GMAP[apos(word).toLowerCase()];
    if(!id || seen.has(id)) return m;
    seen.add(id);
    return pre+'<span class="term" data-t="'+id+'">'+word+'</span>';
  });
}
function linkTermsHtml(html, seen){
  return html.replace(/>([^<]+)</g,(m,txt)=> '>'+linkTermsText(txt,seen)+'<');
}

/* ---------- Sidebar nav ---------- */
function buildNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  const home=document.createElement('button');
  home.className='nav-btn nav-home'; home.id='nav-accueil';
  home.innerHTML=`${iconHome()}<span>Accueil</span>`;
  home.onclick=()=>{ qEl.value=''; showHome(); closeMobile(); };
  nav.appendChild(home);

  const lex=document.createElement('button');
  lex.className='nav-btn nav-lex'; lex.id='nav-lex';
  lex.innerHTML=`${iconDict()}<span>Lexique juridique</span>`;
  lex.onclick=()=>{ showLexique(); closeMobile(); };
  nav.appendChild(lex);

  const mine=document.createElement('button');
  mine.className='nav-btn nav-mine'; mine.id='nav-mine';
  mine.innerHTML=`${iconBookmark()}<span>Mes articles</span>`;
  mine.onclick=()=>{ showMine('fav'); closeMobile(); };
  nav.appendChild(mine);

  const nt=document.createElement('div'); nt.className='navtitle'; nt.textContent='Code du travail'; nav.appendChild(nt);
  LIVRES.forEach(L=>{
    const arts = CODE.filter(a=>a.ln===L.ln);
    if(!arts.length) return;
    const btn=document.createElement('button'); btn.className='nav-btn livre-btn'; btn.dataset.ln=L.ln;
    const short = L.ln===0 ? 'Titre préliminaire' : L.name.split(' — ')[1] || L.name;
    btn.innerHTML=`<span class="ln">${L.ln===0?'P':'L'+L.ln}</span><span>${esc(short)}</span>`;
    btn.onclick=()=>{ showLivre(L.ln); closeMobile(); };
    nav.appendChild(btn);
  });

  const nt2=document.createElement('div'); nt2.className='navtitle conv'; nt2.textContent='Convention des mines & carrières'; nav.appendChild(nt2);
  CONV_TITRES.forEach((T,i)=>{
    const cs=convShort(T.key);
    const btn=document.createElement('button'); btn.className='nav-btn conv-btn'; btn.dataset.ct=i;
    btn.innerHTML=`<span class="ln">${esc(cs.rom)}</span><span>${esc(cs.label)}</span>`;
    btn.onclick=()=>{ showConv(i); closeMobile(); };
    nav.appendChild(btn);
  });
}
function setActiveNav(key){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  let el;
  if(key==='accueil') el=document.getElementById('nav-accueil');
  else if(key==='lexique') el=document.getElementById('nav-lex');
  else if(key==='mine') el=document.getElementById('nav-mine');
  else if(typeof key==='string' && key.startsWith('ct')) el=document.querySelector('.conv-btn[data-ct="'+key.slice(2)+'"]');
  else el=document.querySelector('.livre-btn[data-ln="'+key+'"]');
  if(el) el.classList.add('active');
}
function backBar(){
  return `<div class="viewhead"><button class="backbtn" id="backbtn">${iconArrow()} Retour à l'accueil</button></div>`;
}
function wireBack(){
  const b=document.getElementById('backbtn');
  if(b) b.onclick=()=>{ qEl.value=''; showHome(); };
}
function cleanTitre(t){ return (t||'').replace(/^TITRE\s+[IVX0-9]*\s*[:\-–]?\s*/i,'').replace(/^TITRE PRELIMINAIRE\s*[:\-–]?\s*/i,'Dispositions générales').replace(/\.+$/,'').trim() || t; }
function cleanLabel(t){ return (t||'').replace(/\.{2,}.*$/,'').replace(/\s*\d+([\-–]\d+)?\s*$/,'').trim(); }

/* ---------- Rendering ---------- */
function paras(text){ return (text||'').split('\n\n').map(p=>'<p>'+esc(p)+'</p>').join(''); }
function highlight(html, term){
  if(!term) return html;
  const tn = norm(term); if(tn.length<2) return html;
  return html.replace(/>([^<]+)</g,(m,txt)=>{
    let out=''; let i=0; const low=norm(txt); let idx;
    while((idx=low.indexOf(tn,i))!==-1){
      out+=txt.slice(i,idx)+'<mark>'+txt.slice(idx,idx+tn.length)+'</mark>';
      i=idx+tn.length;
    }
    out+=txt.slice(i);
    return '>'+out+'<';
  });
}

function crumb(a){
  const bits=[];
  if(a.src==='ccmc'){
    bits.push('<span class="srcpill conv">Convention minière</span>');
    const cs=convShort(a.livre);
    if(cs.rom==='—') bits.push('Préliminaires');
    else bits.push('Titre '+esc(cs.rom)+' — '+esc(cs.label));
    if(a.chapitre) bits.push('<span class="sep">›</span>'+esc(cleanConvChap(a.chapitre)));
    return bits.join(' ');
  } else {
    bits.push('<span class="srcpill code">Code du travail</span>');
    const L=LIVRES.find(x=>x.ln===a.ln);
    let tail=[];
    if(L) tail.push('<b>'+esc(L.name.split(' — ')[0])+'</b>');
    if(a.titre) tail.push(esc(cleanTitre(a.titre)));
    if(a.chapitre) tail.push(esc(cleanLabel(a.chapitre.replace(/^CHAPITRE\s+[IVX0-9]*\s*[:\-–]?\s*/i,''))));
    if(a.section) tail.push(esc(cleanLabel(a.section.replace(/^Section\s+[IVX0-9]*\s*[:\-–]?\s*/i,''))));
    return bits.join(' ') + tail.join('<span class="sep">›</span>');
  }
}

function badgeText(a){
  if(a.id==='terminologie') return 'Terminologie';
  if(a.id==='preambule') return 'Préambule';
  return 'Art. '+a.id;
}

function articleCard(a, term){
  const isConv = a.src==='ccmc';
  const seen=new Set();
  const body = linkTermsHtml(paras(a.text), seen);
  const expHtml = a.e
    ? `<div class="panel exp"><span class="lab">${iconBook()} Explication</span><p>${esc(a.e)}</p></div>`
    : `<div class="panel pending"><p>Explication en cours de rédaction.</p></div>`;
  const rhHtml = a.r ? `<div class="panel rh"><span class="lab">${iconBriefcase()} Conseil RH</span><p>${esc(a.r)}</p></div>` : '';
  const title = (isConv && a.titre_court && !isSpecial(a)) ? `<div class="arttitle">${esc(a.titre_court)}</div>` : '';
  const html = `<article class="card${isConv?' ccmc':''}" id="${elId(a)}">
    <div class="head"><button class="badge badgebtn${isConv?' conv':''}" data-open="${a.src}:${esc(a.id)}" title="Ouvrir cet article">${esc(badgeText(a))}</button><div class="crumb">${crumb(a)}</div><div class="cardactions"><button class="favbtn${isFav(a.src+':'+a.id)?' on':''}" data-fav="${a.src}:${esc(a.id)}" title="Favori" aria-label="Favori">${iconStar()}</button><button class="sharebtn" data-asrc="${a.src}" data-aid="${esc(a.id)}" title="Partager cet article" aria-label="Partager">${iconShare()}</button></div></div>
    ${title}
    <div class="artbody">${body}</div>
    <div class="panels">${expHtml}${rhHtml}</div>
  </article>`;
  return term ? highlight(html, term) : html;
}

function iconBook(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M8 3v18"/></svg>';}
function iconBriefcase(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';}
function iconLayers(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>';}
function iconHome(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg>';}
function iconArrow(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>';}
function iconScale(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18"/><path d="M6 21h12"/><path d="M3 7h18"/><path d="M6 3 3 7l3 4 3-4z"/><path d="M18 3l-3 4 3 4 3-4z"/></svg>';}
function iconPick(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 12 3 21"/><path d="M3.5 8.5C7 6 12 5 20.5 5.5c-2 4-6 7.5-12 8"/><path d="M12 12c-.5-3 .5-6 2-8"/></svg>';}

function showLivre(ln){
  location.hash='livre='+ln;
  setActiveNav(ln);
  const L=LIVRES.find(x=>x.ln===ln);
  const arts=CODE.filter(a=>a.ln===ln);
  const groups=[]; const idx={};
  arts.forEach(a=>{ const k=a.titre||''; if(!(k in idx)){idx[k]=groups.length; groups.push({titre:k, items:[]});} groups[idx[k]].items.push(a); });
  const chips = groups.length>1
    ? `<div class="titre-chips">${groups.map((g,i)=>`<button class="tchip" data-i="${i}">${esc(cleanTitre(g.titre)||'Dispositions générales')}</button>`).join('')}</div>`
    : '';
  const secs = groups.map((g,i)=>{
    const h = groups.length>1 ? `<h3 class="tsec-h" id="tsec-${i}">${esc(cleanTitre(g.titre)||'Dispositions générales')}</h3>` : `<span id="tsec-${i}"></span>`;
    return `<section class="tsec">${h}${g.items.map(a=>articleCard(a)).join('')}</section>`;
  }).join('');
  results.innerHTML = backBar()
    + `<div class="resmeta"><h2><span class="srcpill code">Code</span>${esc(L?L.name:'')}</h2><span class="count">${arts.length} article${arts.length>1?'s':''}</span></div>`
    + chips + secs;
  wireBack();
  results.querySelectorAll('.tchip').forEach(c=>c.onclick=()=>{const el=document.getElementById('tsec-'+c.dataset.i); if(el) el.scrollIntoView();});
  window.scrollTo(0,0);
}

function showConv(i){
  location.hash='conv='+i;
  setActiveNav('ct'+i);
  const T=CONV_TITRES[i]; if(!T){ showHome(); return; }
  const cs=convShort(T.key);
  const arts=T.items;
  const groups=[]; const idx={};
  arts.forEach(a=>{ const k=a.chapitre||''; if(!(k in idx)){idx[k]=groups.length; groups.push({chap:k, items:[]});} groups[idx[k]].items.push(a); });
  const secs = groups.map((g,gi)=>{
    const h = (groups.length>1 && g.chap) ? `<h3 class="tsec-h" id="tsec-${gi}">${esc(cleanConvChap(g.chap))}</h3>` : `<span id="tsec-${gi}"></span>`;
    return `<section class="tsec">${h}${g.items.map(a=>articleCard(a)).join('')}</section>`;
  }).join('');
  const heading = cs.rom==='—' ? 'Préliminaires' : 'Titre '+esc(cs.rom)+' — '+esc(cs.label);
  results.innerHTML = backBar()
    + `<div class="resmeta"><h2><span class="srcpill conv">Convention</span>${heading}</h2><span class="count">${arts.length} article${arts.length>1?'s':''}</span></div>`
    + secs;
  wireBack();
  window.scrollTo(0,0);
}

/* ---------- Lexicon view ---------- */
function refLink(uid){
  const [src,id]=uid.split(':');
  if(!UIDS.has(uid)) return '';
  const label = (src==='ccmc'?'Conv. ':'Code ') + (id==='terminologie'?'Terminologie':id==='preambule'?'Préambule':'art. '+id);
  return `<a class="${src}" data-uid="${esc(uid)}">${esc(label)}</a>`;
}
function lexCardHtml(g){
  const refs=(g.refs||[]).map(refLink).filter(Boolean).join('');
  return `<div class="lexcard" id="lex-${esc(g.id)}"><div class="lt">${esc(g.t)}</div><p class="ld">${esc(g.d)}</p>${refs?`<div class="lr">${refs}</div>`:''}</div>`;
}
function showLexique(filter){
  location.hash = filter?('lexq='+encodeURIComponent(filter)):'lex';
  setActiveNav('lexique');
  const terms=[...GLOSS].sort((a,b)=>norm(a.t).localeCompare(norm(b.t)));
  const fn = norm(filter||'');
  const shown = fn ? terms.filter(g=> norm(g.t).includes(fn) || (g.m||[]).some(s=>norm(s).includes(fn)) || norm(g.d).includes(fn)) : terms;
  // group by first letter
  const groups={}; const order=[];
  shown.forEach(g=>{ const L=norm(g.t).charAt(0).toUpperCase(); if(!groups[L]){groups[L]=[];order.push(L);} groups[L].push(g); });
  const alpha = order.map(L=>`<button data-l="${L}">${L}</button>`).join('');
  const body = shown.length
    ? order.map(L=>`<div class="lexletter" id="lexL-${L}">${L}</div>`+groups[L].map(lexCardHtml).join('')).join('')
    : `<div class="lexnone">Aucun terme ne correspond à « ${esc(filter||'')} ».</div>`;
  results.innerHTML = backBar()
    + `<div class="resmeta"><h2>Lexique juridique</h2><span class="count">${GLOSS.length} termes</span></div>`
    + `<p class="lexintro">Les définitions en langage simple des termes juridiques et RH employés dans le Code du travail et la Convention minière. Dans les articles, les mots <span class="term" style="cursor:default">soulignés en pointillés</span> ouvrent leur définition d'un clic.</p>`
    + `<div class="lexsearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg><input id="lexq" type="search" autocomplete="off" placeholder="Filtrer un terme…" value="${esc(filter||'')}"></div>`
    + `<div class="lexalpha">${alpha}</div>`
    + `<div id="lexbody">${body}</div>`;
  wireBack();
  const li=document.getElementById('lexq');
  let lt=null;
  li.addEventListener('input',()=>{clearTimeout(lt);lt=setTimeout(()=>{ renderLexBody(li.value); },160);});
  li.focus();
  results.querySelectorAll('.lexalpha button').forEach(b=>b.onclick=()=>{const el=document.getElementById('lexL-'+b.dataset.l); if(el) el.scrollIntoView();});
  wireLexRefs();
  window.scrollTo(0,0);
}
function renderLexBody(filter){
  const terms=[...GLOSS].sort((a,b)=>norm(a.t).localeCompare(norm(b.t)));
  const fn=norm(filter||'');
  const shown = fn ? terms.filter(g=> norm(g.t).includes(fn) || (g.m||[]).some(s=>norm(s).includes(fn)) || norm(g.d).includes(fn)) : terms;
  const groups={}; const order=[];
  shown.forEach(g=>{ const L=norm(g.t).charAt(0).toUpperCase(); if(!groups[L]){groups[L]=[];order.push(L);} groups[L].push(g); });
  const bodyEl=document.getElementById('lexbody');
  bodyEl.innerHTML = shown.length
    ? order.map(L=>`<div class="lexletter" id="lexL-${L}">${L}</div>`+groups[L].map(lexCardHtml).join('')).join('')
    : `<div class="lexnone">Aucun terme ne correspond à « ${esc(filter||'')} ».</div>`;
  wireLexRefs();
}
function wireLexRefs(){
  results.querySelectorAll('.lexcard .lr a').forEach(a=>a.onclick=()=>{ showArticle(a.dataset.uid); });
}
function gotoArticle(uid){
  const [src,id]=uid.split(':');
  const a=(src==='ccmc'?CONV:CODE).find(x=>x.id===id);
  if(!a) return;
  if(src==='ccmc'){ const i=CONV_TITRES.findIndex(T=>T.items.includes(a)); if(i>=0) showConv(i); }
  else { showLivre(a.ln); }
  setTimeout(()=>{ const el=document.getElementById(elId(a)); if(el){ el.scrollIntoView(); history.replaceState(null,'','#'+elId(a)); } },60);
}

}
function findTheme(qn){
  return THEMES.find(t => t.match.some(m => qn.includes(norm(m))));
}
function findGlossExact(qn){
  for(const g of GLOSS){
    if(norm(g.t)===qn) return g;
    if((g.m||[]).some(s=>norm(s)===qn)) return g;
  }
  return null;
}

function doSearch(){
  const raw=qEl.value.trim();
  const clr=document.getElementById('clear'); clr.style.display=raw?'block':'none';
  if(!raw){ showHome(); return; }
  location.hash='q='+encodeURIComponent(raw);
  logQ(raw);

  const pool = SRC==='all' ? A : (SRC==='code'?CODE:CONV);

  const numMatch = raw.match(/^(?:art\.?\s*|article\s*)?(\d+(?:er)?(?:\.\d+)?)$/i);
  if(numMatch){
    const key=numMatch[1].toLowerCase();
    const fam=pool.filter(a=>a.id===key || a.id.startsWith(key+'.'));
    if(fam.length){ renderSearch(fam, `Article ${esc(key)}`, '', null, null); return; }
    renderEmpty(raw); return;
  }

  const qn=norm(raw);
  const scored=[];
  pool.forEach(a=>{
    const inCtx = norm((a.chapitre||'')+' '+(a.section||'')+' '+(a.titre||'')+' '+(a.livre||'')+' '+(a.titre_court||'')).includes(qn);
    const inTxt = norm(a.text).includes(qn);
    const inExp = norm((a.e||'')+' '+(a.r||'')).includes(qn);
    if(inCtx||inTxt||inExp){
      let s=0; if(inCtx)s+=3; if(inTxt)s+=2; if(inExp)s+=1;
      scored.push({a,s});
    }
  });
  scored.sort((x,y)=> y.s-x.s);
  const arts=scored.map(x=>x.a);
  const theme = SRC==='ccmc' ? null : findTheme(qn);
  const gloss = findGlossExact(qn);
  renderSearch(arts, `« ${esc(raw)} »`, raw, theme, gloss);
}

function renderSearch(arts, title, term, theme, gloss){
  if(!arts.length && !theme && !gloss){ renderEmpty(term||title.replace(/[«»]/g,'').trim()); return; }
  setActiveNav(null);
  const code = arts.filter(a=>a.src==='code');
  const conv = arts.filter(a=>a.src==='ccmc');

  let html=backBar();
  if(gloss){
    html += `<div class="lexbanner"><span class="cap">${iconDict()} Définition</span><div class="lt">${esc(gloss.t)}</div><p class="ld">${esc(gloss.d)}</p><button class="pl" id="lexmore">Ouvrir dans le lexique →</button></div>`;
  }
  if(theme){
    const refs = (theme.refs||[]).map(r=>`<a href="#art-code-${cssid(r)}" data-goto="${esc(r)}">Art. ${esc(r)}</a>`).join('');
    html += `<div class="summary"><span class="cap">${iconLayers()} Synthèse — ${esc(theme.label)}</span><h3>${esc(theme.title)}</h3>${theme.body.map(p=>'<p>'+esc(p)+'</p>').join('')}${refs?`<div class="refs"><b>Articles clés (Code)&nbsp;:</b> ${refs}</div>`:''}</div>`;
  }
  html += `<div class="resmeta"><h2>${title}</h2><span class="count">${arts.length} résultat${arts.length>1?'s':''}</span></div>`;

  if(SRC==='all' && code.length && conv.length){
    html += `<div class="srcblock-h code" id="blk-code">${iconScale()} Code du travail <span class="c">${code.length} article${code.length>1?'s':''}</span></div>`;
    html += code.map(a=>articleCard(a, term)).join('');
    html += `<div class="srcblock-h conv" id="blk-conv">${iconPick()} Convention des mines &amp; carrières <span class="c">${conv.length} article${conv.length>1?'s':''}</span></div>`;
    html += conv.map(a=>articleCard(a, term)).join('');
  } else {
    html += arts.map(a=>articleCard(a, term)).join('');
  }
  results.innerHTML=html;
  wireBack();
  const lm=document.getElementById('lexmore'); if(lm && gloss) lm.onclick=()=>showLexique(gloss.t);
  results.querySelectorAll('.summary .refs a').forEach(a=>a.onclick=e=>{
    e.preventDefault(); const el=document.getElementById('art-code-'+cssid(a.dataset.goto));
    if(el){el.scrollIntoView();}
  });
  window.scrollTo(0,0);
}

function renderEmpty(term){
  setActiveNav(null);
  const scope = SRC==='code'?' dans le Code du travail':SRC==='ccmc'?' dans la Convention minière':'';
  results.innerHTML=backBar()+`<div class="empty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
    <h3>Aucun résultat pour « ${esc(term)} »${scope}</h3>
    <p>Vérifiez l'orthographe, essayez un mot plus court, changez de source ci-dessus, ou consultez le lexique dans le menu.</p>
  </div>`;
  wireBack();
}

/* ---------- Term popover ---------- */
const pop=document.getElementById('lexpop');
function hidePop(){ pop.style.display='none'; }
function showPop(span){
  const id=span.dataset.t; const g=glossById(id); if(!g) return;
  pop.innerHTML=`<button class="px" aria-label="Fermer">✕</button><div class="pt">${esc(g.t)}</div><div class="pd">${esc(g.d)}</div><button class="pl">Ouvrir dans le lexique →</button>`;
  pop.style.display='block';
  const r=span.getBoundingClientRect();
  const pw=pop.offsetWidth, ph=pop.offsetHeight;
  let left=window.scrollX + r.left;
  left=Math.min(left, window.scrollX + document.documentElement.clientWidth - pw - 12);
  left=Math.max(left, window.scrollX + 8);
  let top=window.scrollY + r.bottom + 6;
  if(r.bottom + ph + 12 > window.innerHeight && r.top - ph - 6 > 0) top=window.scrollY + r.top - ph - 6;
  pop.style.left=left+'px'; pop.style.top=top+'px';
  pop.querySelector('.px').onclick=hidePop;
  pop.querySelector('.pl').onclick=()=>{ hidePop(); showLexique(g.t); };
}
document.addEventListener('click',e=>{
  const sp=e.target.closest('.term');
  if(sp && sp.dataset.t){ e.stopPropagation(); showPop(sp); return; }

/* ---------- Share ---------- */
const shareMenu=document.getElementById('sharemenu');
const toastEl=document.getElementById('toast');
let toastT=null;
function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('show'),1900);
}
function hideShareMenu(){ shareMenu.style.display='none'; }
function artUrl(a){ return location.origin+location.pathname+'#a='+a.src+':'+a.id; }
function artLabel(a){
  if(a.id==='terminologie') return 'Terminologie de la Convention minière (Guinée)';
  if(a.id==='preambule') return 'Préambule de la Convention minière (Guinée)';
  return a.src==='ccmc'
    ? 'Art. '+a.id+' de la Convention collective des mines et carrières (Guinée)'
    : 'Art. '+a.id+' du Code du travail guinéen';
}
function copyText(txt){
  if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(txt);
  return new Promise((res,rej)=>{ try{ const t=document.createElement('textarea'); t.value=txt; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t); res(); }catch(e){ rej(e); } });
}
function findArt(src,id){ return (src==='ccmc'?CONV:CODE).find(x=>x.id===id); }
function openShare(btn){
  const a=findArt(btn.dataset.asrc, btn.dataset.aid); if(!a) return;
  const url=artUrl(a);
  const label=artLabel(a);
  const titleLine=label+((a.titre_court && !isSpecial(a))?' — '+a.titre_court:'');
  const shareText=titleLine;
  const fullText=titleLine+'\n\n'+a.text+'\n\nSource : '+url;
  const items=[];
  items.push({cls:'',icon:iconImage(),lab:"Partager l'image",act:()=>shareImage(a,'share')});
  items.push({cls:'',icon:iconDownload(),lab:"Télécharger l'image (JPEG)",act:()=>shareImage(a,'download')});
  items.push({cls:'',icon:iconCopy(),lab:"Copier le texte de l'article",act:()=>{ copyText(fullText).then(()=>toast('Texte copié')).catch(()=>toast('Impossible de copier')); }});
  shareMenu.innerHTML='';
  items.forEach(it=>{ const b=document.createElement('button'); b.className=it.cls; b.innerHTML=it.icon+'<span>'+it.lab+'</span>'; b.onclick=()=>{ hideShareMenu(); it.act(); }; shareMenu.appendChild(b); });
  shareMenu.style.display='block';
  const r=btn.getBoundingClientRect();
  const mw=shareMenu.offsetWidth, mh=shareMenu.offsetHeight;
  let left=window.scrollX + r.right - mw;
  left=Math.max(window.scrollX+8, left);
  let top=window.scrollY + r.bottom + 6;
  if(r.bottom + mh + 12 > window.innerHeight && r.top - mh - 6 > 0) top=window.scrollY + r.top - mh - 6;
  shareMenu.style.left=left+'px'; shareMenu.style.top=top+'px';
}
document.addEventListener('click',e=>{
  const sb=e.target.closest('.sharebtn');
  if(sb){ e.stopPropagation(); if(shareMenu.style.display==='block'){ hideShareMenu(); } else { openShare(sb); } return; }
  if(!e.target.closest('#sharemenu')) hideShareMenu();
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') hideShareMenu(); });
window.addEventListener('scroll',hideShareMenu,true);

/* ---------- Article → image (JPEG) ---------- */
let LOGO_IMG=null;
(function preloadLogo(){ try{ const im=new Image(); im.onload=()=>{LOGO_IMG=im;}; im.src='icon-192.png'; }catch(e){} })();
function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function wrapLines(ctx, text, maxW){
  const out=[];
  (text||'').split('\n\n').forEach((para,pi,arr)=>{
    const words=para.split(/\s+/); let line='';
    words.forEach(w=>{
      const test=line?line+' '+w:w;
      if(ctx.measureText(test).width>maxW && line){ out.push(line); line=w; } else line=test;
    });
    if(line) out.push(line);
    if(pi<arr.length-1) out.push('');
  });
  return out;
}
function truncateLine(ctx,t,maxW){ if(ctx.measureText(t).width<=maxW) return t; let s=t; while(s.length>1 && ctx.measureText(s+'…').width>maxW) s=s.slice(0,-1); return s+'…'; }
function imgContext(a){
  if(a.src==='ccmc'){ const cs=convShort(a.livre); let s=cs.rom==='—'?'Préliminaires':'Titre '+cs.rom+' — '+cs.label; if(a.chapitre) s+=' · '+cleanConvChap(a.chapitre); return s; }
  const L=LIVRES.find(x=>x.ln===a.ln); let s=L?L.name:''; if(a.titre) s+=(s?' · ':'')+cleanTitre(a.titre); return s;
}
async function buildArticleCanvas(a){
  if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }
  const W=1080, PAD=56, CW=W-PAD*2, S=2, PP=24;
  const isConv=a.src==='ccmc';
  const accent=isConv?'#4a4a9e':'#1f5d43';
  const srcLabel=isConv?'CONVENTION DES MINES & CARRIÈRES':'CODE DU TRAVAIL GUINÉEN';
  const badge=(a.id==='terminologie'?'Terminologie':a.id==='preambule'?'Préambule':'Art. '+a.id);
  const titleText=(a.titre_court && !isSpecial(a))?a.titre_court:'';
  const SERIF='Georgia, "Spectral", serif', SANS='"IBM Plex Sans", system-ui, sans-serif';
  const c=document.createElement('canvas'); const ctx=c.getContext('2d');
  // measure
  ctx.font='600 34px '+SERIF; const titleLines=titleText?wrapLines(ctx,titleText,CW):[];
  ctx.font='29px '+SERIF; const textLines=wrapLines(ctx,a.text,CW);
  ctx.font='25px '+SANS; const expLines=a.e?wrapLines(ctx,a.e,CW-PP*2):[]; const rhLines=a.r?wrapLines(ctx,a.r,CW-PP*2):[];
  const LHt=44, LHp=37, LHtt=46;
  const ctxText=imgContext(a);
  const CTXH=ctxText?34:0;
  let H=PAD+30+46+16; // top + source + badge
  H+=CTXH;
  H+=titleLines.length*LHtt+12;
  H+=18+textLines.length*LHt+8;
  if(expLines.length) H+=18+PP*2+32+expLines.length*LHp;
  if(rhLines.length) H+=14+PP*2+32+rhLines.length*LHp;
  H+=30+70+PAD; // footer
  c.width=W*S; c.height=Math.round(H)*S; ctx.scale(S,S);
  // bg
  ctx.fillStyle='#fffdf8'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle=accent; ctx.fillRect(0,0,10,H);
  let y=PAD;
  ctx.textBaseline='alphabetic';
  ctx.fillStyle=accent; ctx.font='700 18px '+SANS; ctx.fillText(srcLabel, PAD, y+16); y+=36;
  ctx.font='600 22px '+SANS; const bw=ctx.measureText(badge).width+28;
  roundRect(ctx,PAD,y,bw,40,9); ctx.fillStyle=accent; ctx.fill();
  ctx.fillStyle='#fff'; ctx.fillText(badge,PAD+14,y+27); y+=40+16;
  if(ctxText){ ctx.fillStyle='#54594c'; ctx.font='20px '+SANS; ctx.fillText(truncateLine(ctx,ctxText,CW), PAD, y+14); y+=CTXH; }
  ctx.fillStyle='#22271f'; ctx.font='600 34px '+SERIF;
  titleLines.forEach(l=>{ ctx.fillText(l,PAD,y+32); y+=LHtt; }); y+=6;
  ctx.fillStyle='#22271f'; ctx.font='29px '+SERIF;
  textLines.forEach(l=>{ if(l) ctx.fillText(l,PAD,y+30); y+=LHt; }); y+=8;
  if(expLines.length){ const ph=PP*2+32+expLines.length*LHp;
    roundRect(ctx,PAD,y,CW,ph,12); ctx.fillStyle='#eef2f4'; ctx.fill();
    ctx.fillStyle='#1f6a80'; ctx.font='700 17px '+SANS; ctx.fillText('EXPLICATION',PAD+PP,y+PP+8);
    ctx.fillStyle='#1c4451'; ctx.font='25px '+SANS; let yy=y+PP+34; expLines.forEach(l=>{ ctx.fillText(l,PAD+PP,yy); yy+=LHp; }); y+=ph+14; }
  if(rhLines.length){ const ph=PP*2+32+rhLines.length*LHp;
    roundRect(ctx,PAD,y,CW,ph,12); ctx.fillStyle='#f7efdd'; ctx.fill();
    ctx.fillStyle='#a9741a'; ctx.font='700 17px '+SANS; ctx.fillText('CONSEIL RH',PAD+PP,y+PP+8);
    ctx.fillStyle='#6a4c15'; ctx.font='25px '+SANS; let yy=y+PP+34; rhLines.forEach(l=>{ ctx.fillText(l,PAD+PP,yy); yy+=LHp; }); y+=ph+14; }
  // footer
  const fy=H-PAD-54;
  ctx.strokeStyle='#dfdacb'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(PAD,fy); ctx.lineTo(W-PAD,fy); ctx.stroke();
  let tx=PAD; const ly=fy+14;
  if(LOGO_IMG){ try{ ctx.drawImage(LOGO_IMG,PAD,ly,42,42); tx=PAD+54; }catch(e){} }
  ctx.fillStyle='#22271f'; ctx.font='600 21px '+SANS; ctx.fillText('Code du Travail & Convention minière — Guinée', tx, ly+18);
  ctx.fillStyle='#54594c'; ctx.font='18px '+SANS; ctx.fillText('code-travail-guinee.vercel.app', tx, ly+40);
  // tiny flag
  const fx=W-PAD-54; ['#ce1126','#fcd116','#009460'].forEach((col,i)=>{ ctx.fillStyle=col; ctx.fillRect(fx+i*18, ly+12, 16, 20); });
  // subtle frame
  ctx.strokeStyle='#e4dfd0'; ctx.lineWidth=2; ctx.strokeRect(1,1,W-2,H-2);
  return c;
}
async function shareImage(a, mode){
  toast('Génération de l’image…');
  let c; try{ c=await buildArticleCanvas(a); }catch(e){ toast('Échec de la génération'); return; }
  const name='article-'+a.src+'-'+String(a.id).replace(/[^a-z0-9]/gi,'-');
  c.toBlob(blob=>{
    if(!blob){ toast('Échec de la génération'); return; }
    const file=new File([blob], name+'.jpg', {type:'image/jpeg'});
    if(mode==='share' && navigator.canShare && navigator.canShare({files:[file]}) && navigator.share){
      navigator.share({files:[file], title:artLabel(a)}).catch(()=>{});
    } else {
      const url=URL.createObjectURL(blob);
      const link=document.createElement('a'); link.href=url; link.download=name+'.jpg';
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(()=>URL.revokeObjectURL(url),5000);
      toast('Image enregistrée');
    }
  },'image/jpeg',0.92);
}

/* ---------- Open article / toggle favorite ---------- */
document.addEventListener('click',e=>{
  const ob=e.target.closest('[data-open]');
  if(ob){ e.preventDefault(); showArticle(ob.dataset.open); return; }
  const fb=e.target.closest('[data-fav]');
  if(fb){ e.preventDefault(); const uid=fb.dataset.fav; const added=toggleFav(uid);
    fb.classList.toggle('on',added); toast(added?'Ajouté aux favoris':'Retiré des favoris');
    if((location.hash||'').indexOf('mine=fav')>=0) showMine('fav');
    return; }
});

/* ---------- Source filter ---------- */
function initFilter(){
  document.querySelectorAll('#srcfilter button').forEach(b=>{
    b.onclick=()=>{
      SRC=b.dataset.src;
      document.querySelectorAll('#srcfilter button').forEach(x=>x.classList.toggle('active',x===b));
      if(qEl.value.trim()) doSearch(); else showHome();
    };
  });
}

/* ---------- Theme toggle ---------- */
function initTheme(){
  const btn=document.getElementById('themebtn');
  let cur=null; try{cur=localStorage.getItem('ct-theme');}catch(e){}
  if(cur) document.documentElement.setAttribute('data-theme',cur);
  btn.onclick=()=>{
    const isDark = document.documentElement.getAttribute('data-theme')==='dark'
      || (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme:dark)').matches);
    const next = isDark?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    try{localStorage.setItem('ct-theme',next);}catch(e){}
  };
}

/* ---------- Mobile ---------- */
function closeMobile(){document.getElementById('sidebar').classList.remove('show');document.getElementById('backdrop').classList.remove('show');}
document.getElementById('mobtoggle').onclick=()=>{document.getElementById('sidebar').classList.toggle('show');document.getElementById('backdrop').classList.toggle('show');};
document.getElementById('backdrop').onclick=closeMobile;

/* ---------- Wire up ---------- */
let t=null;
const qEl=document.getElementById('q');
qEl.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(doSearch,140);});
document.getElementById('clear').onclick=()=>{qEl.value='';qEl.focus();doSearch();};
document.querySelector('.brand').style.cursor='pointer';
document.querySelector('.brand').onclick=()=>{qEl.value='';showHome();};

function route(){
  const h=decodeURIComponent(location.hash.replace(/^#/,''));
  if(h.startsWith('q=')){ qEl.value=h.slice(2); doSearch(); }
  else if(h.startsWith('livre=')){ showLivre(parseInt(h.slice(6))||0); }
  else if(h.startsWith('conv=')){ showConv(parseInt(h.slice(5))||0); }
  else if(h.startsWith('lexq=')){ showLexique(h.slice(5)); }
  else if(h==='lex'){ showLexique(); }
  else if(h.startsWith('mine=')){ showMine(h.slice(5)); }
  else if(h==='mine'){ showMine('fav'); }
  else if(h.startsWith('a=')){ showArticle(h.slice(2)); }
  else if(h.startsWith('art-')){ showHome(); }
  else showHome();
}
window.addEventListener('hashchange', ()=>{ if(A.length && !location.hash.startsWith('#art-')) route(); });
initTheme();
initFilter();
results.innerHTML='<div style="padding:70px 20px;text-align:center;color:var(--ink-soft)">Chargement des textes…</div>';
Promise.all([
  fetch('articles.json').then(r=>r.json()),
  fetch('explanations.json').then(r=>r.json()),
  fetch('themes.json').then(r=>r.json()),
  fetch('convention.json').then(r=>r.json()),
  fetch('convention_explanations.json').then(r=>r.json()),
  fetch('lexique.json').then(r=>r.json())
]).then(([arts,exp,themes,conv,cexp,lex])=>{
  arts.forEach(a=>{const e=exp[a.id]||{}; a.e=e.e||''; a.r=e.r||''; a.src='code';});
  conv.forEach(a=>{const e=cexp[a.id]||{}; a.e=e.e||''; a.r=e.r||''; a.src='ccmc';});
  CODE=arts; CONV=conv; THEMES=themes; GLOSS=lex;
  A=CODE.concat(CONV);
  UIDS=new Set(A.map(a=>a.src+':'+a.id));
  buildConvTitres(); buildGloss();
  buildNav(); route();
}).catch(err=>{
  results.innerHTML='<div style="padding:60px 24px;text-align:center;color:var(--ink-soft)"><h3 style="font-family:var(--serif);color:var(--ink)">Impossible de charger les données</h3><p>Cette page doit être servie par un serveur web (hébergement en ligne), et non ouverte par double-clic depuis votre ordinateur.</p></div>';
});

/* Service worker : active l'usage hors connexion. */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
